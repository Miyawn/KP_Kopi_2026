<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart Tahapan Kegiatan Kerja Praktik</title>
  <desc id="desc">Flowchart metodologi kerja praktik U Can Do It Coffee Shop dari identifikasi kebutuhan sampai evaluasi dan penyusunan laporan.</desc>

  <defs>
    <style>
      .title { font-family: "Times New Roman", serif; font-size: 28px; font-weight: bold; fill: #111111; }
      .label { font-family: "Times New Roman", serif; font-size: 20px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .body { font-family: "Times New Roman", serif; font-size: 18px; fill: #111111; text-anchor: middle; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.5; }
      .arrow { stroke: #111111; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111111" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1700" fill="#ffffff" />
  <text x="600" y="55" class="title">Flowchart Tahapan Kegiatan Kerja Praktik</text>

  <rect x="390" y="90" rx="40" ry="40" width="420" height="80" class="box" />
  <text x="600" y="139" class="label">Mulai</text>

  <line x1="600" y1="170" x2="600" y2="220" class="arrow" />

  <rect x="240" y="220" width="720" height="120" rx="12" ry="12" class="box" />
  <text x="600" y="265" class="label">Identifikasi Kebutuhan</text>
  <text x="600" y="300" class="body">Mengidentifikasi kebutuhan mitra dari sisi alur pemesanan,</text>
  <text x="600" y="326" class="body">backend, dan admin dashboard.</text>

  <line x1="600" y1="340" x2="600" y2="390" class="arrow" />

  <rect x="240" y="390" width="720" height="120" rx="12" ry="12" class="box" />
  <text x="600" y="435" class="label">Pengumpulan Data</text>
  <text x="600" y="470" class="body">Melakukan observasi, diskusi dengan mitra,</text>
  <text x="600" y="496" class="body">dan mempelajari referensi terkait pengembangan sistem.</text>

  <line x1="600" y1="510" x2="600" y2="560" class="arrow" />

  <rect x="240" y="560" width="720" height="120" rx="12" ry="12" class="box" />
  <text x="600" y="605" class="label">Perancangan Sistem</text>
  <text x="600" y="640" class="body">Menyusun rancangan halaman, alur navigasi, struktur data,</text>
  <text x="600" y="666" class="body">dan pembagian peran antara pelanggan dan admin.</text>

  <line x1="600" y1="680" x2="600" y2="730" class="arrow" />

  <rect x="240" y="730" width="720" height="140" rx="12" ry="12" class="box" />
  <text x="600" y="775" class="label">Implementasi</text>
  <text x="600" y="810" class="body">Membangun aplikasi menggunakan React dan Vite,</text>
  <text x="600" y="836" class="body">lalu mengintegrasikannya dengan Supabase untuk autentikasi,</text>
  <text x="600" y="862" class="body">data produk, data pesanan, dan pembaruan status.</text>

  <line x1="600" y1="870" x2="600" y2="920" class="arrow" />

  <rect x="240" y="920" width="720" height="120" rx="12" ry="12" class="box" />
  <text x="600" y="965" class="label">Pengujian</text>
  <text x="600" y="1000" class="body">Melakukan pengujian fungsional pada alur pemesanan,</text>
  <text x="600" y="1026" class="body">manajemen produk, status pesanan, dan ekspor laporan.</text>

  <line x1="600" y1="1040" x2="600" y2="1090" class="arrow" />

  <rect x="240" y="1090" width="720" height="140" rx="12" ry="12" class="box" />
  <text x="600" y="1135" class="label">Evaluasi dan Penyusunan Laporan</text>
  <text x="600" y="1170" class="body">Mengevaluasi hasil implementasi, mencatat kendala,</text>
  <text x="600" y="1196" class="body">merumuskan solusi, dan menyusun laporan kerja praktik.</text>

  <line x1="600" y1="1230" x2="600" y2="1280" class="arrow" />

  <rect x="390" y="1280" rx="40" ry="40" width="420" height="80" class="box" />
  <text x="600" y="1329" class="label">Selesai</text>

  <text x="600" y="1415" class="body">Gambar 4.1 Flowchart Tahapan Kegiatan Kerja Praktik</text>
  <text x="600" y="1450" class="body">Sumber: Hasil olahan penulis, 2026</text>
</svg>
